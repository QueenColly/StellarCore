name: Audit public API error contract

# Focused audit only. Lint, typecheck, the full test suite, and the production
# build run in the required `Lint, typecheck, test, build` check (ci.yml).
on:
  pull_request:
    paths:
      - "app/api/anchors/**"
      - "app/api/corridors/**"
      - "app/api/rates/**"
      - "app/api/reputation/**"
      - "lib/api/anchors.ts"
      - "lib/api/corridors.ts"
      - "lib/api/errors.ts"
      - "lib/api/http.ts"
      - "lib/api/rates.ts"
      - "lib/api/rateHistory.ts"
      - "lib/api/reputation.ts"
      - "types/api/**"
      - "tests/unit/api/**"
      - ".github/workflows/audit-api-error-contract.yml"

permissions:
  contents: read

jobs:
  audit:
    name: audit public API error contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://stellarcore:stellarcore@localhost:5432/stellarcore
        run: npx prisma generate
      - name: Run API contract tests
        run: node --import tsx --test tests/unit/api/*.test.ts
