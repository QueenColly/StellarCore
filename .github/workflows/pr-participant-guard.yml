name: PR Participant Guard

# Only pull_request_target: it always runs this trusted default-branch
# definition. Review and review-comment events would run the pull request's own
# copy of this workflow, and issue_comment results never attach to the pull
# request, so neither is used. Re-run the latest job to re-evaluate new comments.
on:
  pull_request_target:
    branches: [development, main]
    types: [opened, reopened, synchronize, ready_for_review, edited, review_requested, review_request_removed]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-participant-guard-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  participant-guard:
    name: PR Participant Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted default-branch code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect participation through the GitHub API
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/security/check-pr-participants.mjs
