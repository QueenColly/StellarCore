name: Audit registry reconciliation

# Focused audit only. Lint, typecheck, the full test suite, and the production
# build run in the required `Lint, typecheck, test, build` check (ci.yml).
on:
  pull_request:
    paths:
      - "lib/stellar/registryReconciliation*"
      - "scripts/reconcile-registry.ts"
      - "tests/unit/stellar/registryReconciliation.test.ts"
      - "tests/integration/stellar/registryReconciliation.integration.test.ts"
      - "types/registryReconciliation.ts"
      - "package.json"
      - ".github/workflows/audit-registry-reconciliation.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://stellarcore:stellarcore@localhost:5432/stellarcore
        run: npx prisma generate
      - run: node --import tsx --test tests/unit/stellar/registryReconciliation.test.ts tests/integration/stellar/registryReconciliation.integration.test.ts
